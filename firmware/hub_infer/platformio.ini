; CryNet hub — inference core (Stage 2a)
; ESP32-S3-DevKitC-1 N16R8: 16 MB flash, 8 MB octal PSRAM
; PlatformIO / ESP-IDF framework (framework = espidf)
;
; The project is a normal ESP-IDF project: firmware/hub_infer/CMakeLists.txt
; sets up EXTRA_COMPONENT_DIRS for the vendored TFLite Micro port, and
; src/CMakeLists.txt declares the main component.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; The TFLite Micro port requires ESP-IDF >= 5.1; the platform's default
; framework is 4.6.1, so pin a 5.x release explicitly.
platform_packages =
    framework-espidf @ https://github.com/espressif/esp-idf/releases/download/v5.3.2/esp-idf-v5.3.2.zip

; --- memory layout -------------------------------------------------------
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; --- build ---------------------------------------------------------------
build_flags =
    -DCOMPILER_OPTIMIZATION_PERF
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 921600
