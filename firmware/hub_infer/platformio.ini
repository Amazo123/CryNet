; CryNet hub — inference core (Stage 2a)
; ESP32-S3-DevKitC-1 N16R8: 16 MB flash, 8 MB octal PSRAM
; PlatformIO / ESP-IDF framework (framework = espidf)
;
; The project is a normal ESP-IDF project: firmware/hub_infer/CMakeLists.txt
; sets up EXTRA_COMPONENT_DIRS for the vendored TFLite Micro port, and
; src/CMakeLists.txt declares the main component.

[env:esp32s3]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = espidf

; The framework is the one the platform ships: platform-espressif32 8.0.0
; bundles framework-espidf 4.60100.0, which is ESP-IDF 6.1.0. That is well
; above the >= 5.1 that the TFLite Micro port asks for.
;
; Do NOT pin framework-espidf with a `platform_packages` URL here. PlatformIO
; 6.2 installs a URL-specified framework by treating the archive as an npm
; package: it reads the wrong package.json out of the tree and leaves
; packages/framework-espidf holding only a test-fixture package instead of
; the framework, so CMake then fails with "include could not find requested
; file: .../tools/cmake/project.cmake". The framework is now installed
; manually and pinned by packages/framework-espidf/.piopm.
;
; Keep managed_components between builds: the IDF component manager downloads
; espressif/esp-nn there, and PlatformIO otherwise wipes it on every
; configure.
board_build.esp-idf.overwrite_managed_components = no

; --- memory layout -------------------------------------------------------
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; --- build ---------------------------------------------------------------
build_flags =
    -DCOMPILER_OPTIMIZATION_PERF
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 921600
